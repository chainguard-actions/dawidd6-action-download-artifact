name: Test run_id and run_number inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-run-id
        uses: .
        continue-on-error: true
        with:
          run_id: "12345678"
          name: my-artifact
          if_no_artifact_found: ignore
      - name: Assert action ran with run_id input
        env:
          OUTCOME: ${{ steps.action-run-id.outcome }}
          FOUND: ${{ steps.action-run-id.outputs.found_artifact }}
          ERROR: ${{ steps.action-run-id.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERROR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with run_id"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or invalid run_id)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - id: action-run-number
        uses: .
        continue-on-error: true
        with:
          workflow: CI
          run_number: "1"
          name: my-artifact
          if_no_artifact_found: ignore
      - name: Assert action ran with run_number input
        env:
          OUTCOME: ${{ steps.action-run-number.outcome }}
          FOUND: ${{ steps.action-run-number.outputs.found_artifact }}
          ERROR: ${{ steps.action-run-number.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERROR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with run_number"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or no matching run)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
