name: Test if_no_artifact_found warn mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          name: nonexistent-artifact-xyz-12345
          path: ./downloaded-artifacts
          if_no_artifact_found: warn
      - name: Assert action ran with warn mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ERROR: ${{ steps.action.outputs.error_message }}
          ARTIFACTS: ${{ steps.action.outputs.artifacts }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERROR"
          echo "artifacts: $ARTIFACTS"
          if [ "$OUTCOME" = "success" ]; then
            # With warn mode, action should succeed even if artifact not found
            echo "PASS: action succeeded (warn mode allows missing artifacts)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
