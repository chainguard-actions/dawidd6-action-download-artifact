name: Test fail mode when artifact not found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          name: nonexistent-artifact-fail-test
          if_no_artifact_found: fail

      - name: Assert action failed when artifact not found with fail mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ERR: ${{ steps.action.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERR"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when artifact not found (fail mode) or sentinel repo not resolvable"
          elif [ "$OUTCOME" = "success" ]; then
            # If somehow the action succeeded, found_artifact must be false (no artifact found)
            if [ "$FOUND" = "false" ] || [ -z "$FOUND" ]; then
              echo "PASS: action succeeded but correctly reported artifact not found"
            else
              echo "FAIL: action succeeded and claimed to find artifact '$FOUND' which should not exist"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
