name: Test skip_unpack option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          name: some-artifact-skip-unpack
          skip_unpack: true
          if_no_artifact_found: ignore
          workflow_conclusion: success
          path: ./artifact-output
        continue-on-error: true

      - name: Assert skip_unpack mode runs without hard failure
        env:
          FOUND: ${{ steps.action.outputs.found_artifact }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          # With skip_unpack and ignore mode, action should succeed (no artifact found)
          # or fail gracefully because the sentinel repo is not resolvable
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: skip_unpack mode succeeded, found_artifact=$FOUND"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
