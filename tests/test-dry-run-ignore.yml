name: Test dry_run with if_no_artifact_found ignore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: true
          name: nonexistent-artifact-xyz
          if_no_artifact_found: ignore

      - name: Assert dry_run or graceful failure
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DRY_RUN_OUT: ${{ steps.action.outputs.dry_run }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ERR: ${{ steps.action.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "dry_run output: $DRY_RUN_OUT"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERR"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded: found_artifact should be false since artifact doesn't exist
            if [ "$FOUND" = "true" ]; then
              echo "FAIL: expected found_artifact=false for nonexistent artifact"
              exit 1
            fi
            echo "PASS: action succeeded, found_artifact=$FOUND"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
