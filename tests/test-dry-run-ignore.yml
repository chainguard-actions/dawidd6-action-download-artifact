name: Test dry-run with ignore on missing artifact
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          name: nonexistent-artifact-xyz
          dry_run: true
          if_no_artifact_found: ignore

      - name: Assert action ran and handled missing artifact gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          DRY: ${{ steps.action.outputs.dry_run }}
          ERR: ${{ steps.action.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "dry_run output: $DRY"
          echo "error_message: $ERR"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — found_artifact should be false since artifact doesn't exist
            if [ "$FOUND" = "false" ] || [ -z "$FOUND" ]; then
              echo "PASS: action succeeded and correctly reported artifact not found"
            else
              echo "FAIL: expected found_artifact=false but got: $FOUND"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
