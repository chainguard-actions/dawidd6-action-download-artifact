name: Test artifacts JSON output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: nonexistent-artifact-output-test
          if_no_artifact_found: ignore
          workflow_conclusion: success
          workflow_search: true
      - name: Assert artifacts output is set or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ARTIFACTS: ${{ steps.action.outputs.artifacts }}
          ERROR: ${{ steps.action.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "artifacts: $ARTIFACTS"
          echo "error_message: $ERROR"
          if [ "$OUTCOME" = "success" ]; then
            # found_artifact should be false since sentinel repo has no artifacts
            if [ "$FOUND" != "false" ]; then
              echo "FAIL: expected found_artifact to be false, got '$FOUND'"
              exit 1
            fi
            echo "PASS: outputs are set correctly, found_artifact=false"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
