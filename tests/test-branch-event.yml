name: Test branch and event inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          workflow: ci.yml
          branch: main
          event: push
          dry_run: true
          if_no_artifact_found: ignore
      - name: Assert action completed
        env:
          FOUND: ${{ steps.action.outputs.found_artifact }}
        run: |
          echo "found_artifact: $FOUND"
          echo "PASS: action completed with branch and event inputs"
