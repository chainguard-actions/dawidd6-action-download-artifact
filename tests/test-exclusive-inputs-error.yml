name: Test mutually exclusive inputs error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo: dawidd6/action-download-artifact
          workflow: build.yml
          pr: "1"
          commit: "0000000000000000000000000000000000000000"
          path: ./exclusive-out
      - name: Assert action failed with exclusive inputs error
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERR: ${{ steps.action.outputs.error_message }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
        run: |
          echo "outcome: $OUTCOME"
          echo "error_message: $ERR"
          echo "found_artifact: $FOUND"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome"
            exit 1
          fi
          if ! echo "$ERR" | grep -q "cannot be used together"; then
            echo "FAIL: expected 'cannot be used together' in error_message"
            exit 1
          fi
          if [ "$FOUND" != "false" ]; then
            echo "FAIL: expected found_artifact=false"
            exit 1
          fi
          echo "PASS"
