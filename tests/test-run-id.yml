name: Test run_id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # Use a run_id that won't exist on the sentinel repo
          run_id: "1"
          name: test-artifact
          if_no_artifact_found: ignore

      - name: Assert action handled run_id lookup gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ERROR_MSG: ${{ steps.action.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERROR_MSG"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with run_id input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or run not found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
