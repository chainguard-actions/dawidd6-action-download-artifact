name: Test no matching run with if_no_artifact_found=ignore
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo: dawidd6/action-download-artifact
          workflow_search: "true"
          commit: "0000000000000000000000000000000000000000"
          if_no_artifact_found: ignore
          path: ./ignore-out
      - name: Assert action succeeded with found_artifact=false
        env:
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ERR: ${{ steps.action.outputs.error_message }}
        run: |
          echo "found_artifact: $FOUND"
          echo "error_message: $ERR"
          if [ "$FOUND" != "false" ]; then
            echo "FAIL: expected found_artifact=false"
            exit 1
          fi
          if [ -n "$ERR" ]; then
            echo "FAIL: expected empty error_message"
            exit 1
          fi
          if [ -d ./ignore-out ] && [ -n "$(ls -A ./ignore-out)" ]; then
            echo "FAIL: nothing should have been downloaded"
            exit 1
          fi
          echo "PASS"
