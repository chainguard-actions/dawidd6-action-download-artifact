name: Test default repo (current workflow run lookup)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: "true"
          path: ./default-out
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ERR: ${{ steps.action.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERR"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$FOUND" != "true" ] && [ "$FOUND" != "false" ]; then
              echo "FAIL: action succeeded but found_artifact is not a boolean"
              exit 1
            fi
            echo "PASS: found_artifact=$FOUND"
          elif [ "$OUTCOME" = "failure" ]; then
            if [ -z "$ERR" ]; then
              echo "FAIL: expected error_message to be set on failure"
              exit 1
            fi
            if [ "$FOUND" != "false" ]; then
              echo "FAIL: expected found_artifact=false on failure"
              exit 1
            fi
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
