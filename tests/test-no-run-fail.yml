name: Test no matching run with default if_no_artifact_found=fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo: dawidd6/action-download-artifact
          workflow_search: "true"
          commit: "0000000000000000000000000000000000000000"
          path: ./fail-out
      - name: Assert action failed with found_artifact=false
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure outcome when no run is found"
            exit 1
          fi
          if [ "$FOUND" != "false" ]; then
            echo "FAIL: expected found_artifact=false"
            exit 1
          fi
          echo "PASS"
