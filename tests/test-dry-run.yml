name: Test dry run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: some-artifact
          dry_run: true
          if_no_artifact_found: ignore
          workflow_conclusion: success
          workflow_search: true
      - name: Assert dry_run mode works or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ERROR: ${{ steps.action.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERROR"
          if [ "$OUTCOME" = "success" ]; then
            # In dry_run mode with no artifacts, found_artifact should be false
            if [ "$FOUND" != "false" ]; then
              echo "FAIL: expected found_artifact to be false in dry_run mode, got '$FOUND'"
              exit 1
            fi
            # Verify no artifact files were extracted (dry_run should not download)
            if [ -f "./some-artifact" ]; then
              echo "FAIL: artifact file should not exist in dry_run mode"
              exit 1
            fi
            echo "PASS: dry_run mode correctly reported no artifact without downloading"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
