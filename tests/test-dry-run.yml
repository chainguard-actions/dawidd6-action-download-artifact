name: Test dry_run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          name: my-artifact
          dry_run: true
          if_no_artifact_found: fail
      - name: Assert dry_run ran and produced expected outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ERROR: ${{ steps.action.outputs.error_message }}
          ARTIFACTS: ${{ steps.action.outputs.artifacts }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERROR"
          echo "artifacts: $ARTIFACTS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FOUND" ]; then
              echo "FAIL: action succeeded but found_artifact output is empty"
              exit 1
            fi
            echo "PASS: dry_run succeeded with found_artifact=$FOUND"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully in dry_run mode (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
