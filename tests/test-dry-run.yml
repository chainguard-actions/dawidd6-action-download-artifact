name: Test dry_run mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: my-artifact
          dry_run: true
          if_no_artifact_found: fail
      - name: Assert dry_run produced expected outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ERROR: ${{ steps.action.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERROR"
          if [ "$OUTCOME" = "success" ]; then
            # In dry_run mode, found_artifact should be set
            if [ -z "$FOUND" ]; then
              echo "FAIL: action succeeded but found_artifact output is empty"
              exit 1
            fi
            echo "PASS: dry_run completed, found_artifact=$FOUND"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or artifact not found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
