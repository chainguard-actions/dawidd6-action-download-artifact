name: Test dry_run with name and workflow inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          workflow: ci.yml
          name: my-artifact
          dry_run: true
          if_no_artifact_found: ignore
      - name: Assert dry_run output is set
        env:
          DRY_RUN_OUT: ${{ steps.action.outputs.dry_run }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
        run: |
          echo "dry_run output: $DRY_RUN_OUT"
          echo "found_artifact output: $FOUND"
          echo "PASS: action completed without error"
