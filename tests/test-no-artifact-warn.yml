name: Test if_no_artifact_found warn behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: nonexistent-artifact-abc
          if_no_artifact_found: warn

      - name: Assert warn mode does not hard-fail or fails gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ERR: ${{ steps.action.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERR"
          if [ "$OUTCOME" = "success" ]; then
            # With warn mode and no artifact, action should succeed (just warn)
            # found_artifact should be false
            if [ "$FOUND" = "true" ]; then
              echo "FAIL: expected found_artifact=false for nonexistent artifact"
              exit 1
            fi
            echo "PASS: action warned and continued, found_artifact=$FOUND"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
