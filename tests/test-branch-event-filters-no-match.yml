name: Test branch/event/run_number/name filters with no matching run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo: dawidd6/action-download-artifact
          workflow_search: "true"
          branch: refs/heads/this-branch-does-not-exist-act-harness-xyz
          event: push
          run_number: "999999999"
          name: nonexistent-artifact
          if_no_artifact_found: ignore
          path: ./filters-out
      - name: Assert no artifact found and no error
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ERR: ${{ steps.action.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERR"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success outcome"
            exit 1
          fi
          if [ "$FOUND" != "false" ]; then
            echo "FAIL: expected found_artifact=false"
            exit 1
          fi
          if [ -n "$ERR" ]; then
            echo "FAIL: expected empty error_message"
            exit 1
          fi
          if [ -d ./filters-out ] && [ -n "$(ls -A ./filters-out)" ]; then
            echo "FAIL: nothing should have been downloaded"
            exit 1
          fi
          echo "PASS"
