name: Test artifact name as regexp
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: "my-artifact-.*"
          name_is_regexp: true
          if_no_artifact_found: ignore
      - name: Assert regexp mode ran without unexpected errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ARTIFACTS: ${{ steps.action.outputs.artifacts }}
          ERROR: ${{ steps.action.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "artifacts: $ARTIFACTS"
          echo "error_message: $ERROR"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded; found_artifact should be a boolean string
            if [ "$FOUND" != "true" ] && [ "$FOUND" != "false" ]; then
              echo "FAIL: found_artifact should be 'true' or 'false', got: '$FOUND'"
              exit 1
            fi
            echo "PASS: regexp mode completed, found_artifact=$FOUND"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
