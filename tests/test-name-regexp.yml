name: Test name_is_regexp feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          name: "artifact-.*"
          name_is_regexp: true
          if_no_artifact_found: ignore
          workflow: test.yml

      - name: Assert action handled regexp name gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ARTIFACTS: ${{ steps.action.outputs.artifacts }}
          ERROR_MSG: ${{ steps.action.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "artifacts: $ARTIFACTS"
          echo "error_message: $ERROR_MSG"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with name_is_regexp mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
