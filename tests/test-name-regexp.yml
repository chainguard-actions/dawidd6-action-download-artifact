name: Test name_is_regexp with dry_run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          dry_run: true
          name: ".*artifact.*"
          name_is_regexp: true
          if_no_artifact_found: ignore

      - name: Assert regexp mode runs without error or fails gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DRY_RUN_OUT: ${{ steps.action.outputs.dry_run }}
          FOUND: ${{ steps.action.outputs.found_artifact }}
          ERR: ${{ steps.action.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "dry_run output: $DRY_RUN_OUT"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with regexp name matching, found_artifact=$FOUND"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
