name: Test commit and ref inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action-commit
        uses: .
        continue-on-error: true
        with:
          workflow: CI
          commit: ${{ steps.get-sha.outputs.sha }}
          name: my-artifact
          if_no_artifact_found: ignore
      - name: Assert action ran with commit input
        env:
          OUTCOME: ${{ steps.action-commit.outcome }}
          FOUND: ${{ steps.action-commit.outputs.found_artifact }}
          ERROR: ${{ steps.action-commit.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERROR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with commit input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
      - id: action-ref
        uses: .
        continue-on-error: true
        with:
          workflow: CI
          ref: main
          name: my-artifact
          if_no_artifact_found: ignore
      - name: Assert action ran with ref input
        env:
          OUTCOME: ${{ steps.action-ref.outcome }}
          FOUND: ${{ steps.action-ref.outputs.found_artifact }}
          ERROR: ${{ steps.action-ref.outputs.error_message }}
        run: |
          echo "outcome: $OUTCOME"
          echo "found_artifact: $FOUND"
          echo "error_message: $ERROR"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with ref input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
