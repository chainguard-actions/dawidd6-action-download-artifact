name: Download

on:
  push:
    branches:
      - master
  pull_request:

permissions: {}

concurrency:
  group: download

jobs:
  wait:
    runs-on: ubuntu-latest
    steps:
      - name: Wait
        run: sleep 60
  download-latest:
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          workflow: upload.yml
          name: artifact
          path: artifact
      - name: Test
        run: cat artifact/sha | grep $GITHUB_SHA
  download-search-workflow:
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          name: artifact
          path: artifact
          workflow_search: true
      - name: Test
        run: cat artifact/sha | grep $GITHUB_SHA
  download-branch:
    runs-on: ubuntu-latest
    needs: wait
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          workflow: upload.yml
          name: artifact
          path: artifact
          branch: master
      - name: Test
        run: cat artifact/sha | grep $GITHUB_SHA
  download-pr:
    runs-on: ubuntu-latest
    needs: wait
    if: github.ref != 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          workflow: upload.yml
          name: artifact
          path: artifact
          pr: ${{github.event.pull_request.number}}
      - name: Test
        run: cat artifact/sha | grep $GITHUB_SHA
  download-commit:
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          workflow: upload.yml
          name: artifact
          path: artifact
          commit: ${{github.event.pull_request.head.sha || github.sha}}
      - name: Test
        run: cat artifact/sha | grep $GITHUB_SHA
  download-ref-branch:
    runs-on: ubuntu-latest
    needs: wait
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          workflow: upload.yml
          name: artifact
          path: artifact
          ref: master
      - name: Test
        run: cat artifact/sha | grep $GITHUB_SHA
  download-ref-commit:
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          workflow: upload.yml
          name: artifact
          path: artifact
          ref: ${{github.event.pull_request.head.sha || github.sha}}
      - name: Test
        run: cat artifact/sha | grep $GITHUB_SHA
  download-multiple:
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          workflow: upload.yml
      - name: Test
        run: |
          cat artifact/sha | grep $GITHUB_SHA
          cat artifact1/sha1 | grep $GITHUB_SHA
          cat artifact2/sha2 | grep $GITHUB_SHA
  download-regexp:
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          workflow: upload.yml
          name: artifact.
          name_is_regexp: true
      - name: Test
        run: |
          cat artifact1/sha1 | grep $GITHUB_SHA
          cat artifact2/sha2 | grep $GITHUB_SHA
          ! test -d artifact/artifact
          ! test -f artifact.zip
  download-empty-conclusion:
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          workflow: upload.yml
          name: artifact
          path: artifact
          workflow_conclusion:
      - name: Test
        run: cat artifact/sha | grep $GITHUB_SHA
  download-skip-unpack:
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          workflow: upload.yml
          name: artifact
          path: artifact
          skip_unpack: true
      - name: Test
        run: |
          test -d artifact
          test -f artifact/artifact.zip
          ! test -d artifact/artifact
          ! test -f artifact.zip
          unzip -l artifact/artifact.zip
  download-use-unzip:
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          workflow: upload.yml
          name: artifact
          path: artifact
          use_unzip: true
      - name: Test
        run: |
          test -d artifact
          ! test -d artifact/artifact
          ! test -f artifact.zip
          ! test -f artifact/artifact.zip
          cat artifact/sha | grep $GITHUB_SHA
  download-dry-run-exists:
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        id: download
        uses: ./
        with:
          workflow: upload.yml
          name: artifact
          path: artifact
          dry_run: true
      - name: Test
        env:
          DRY_RUN: ${{ steps.download.outputs.dry_run }}
        run: test "$DRY_RUN" == true
  download-dry-run-not-exists:
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        id: download
        uses: ./
        with:
          workflow: upload.yml
          name: not-artifact
          path: artifact
          dry_run: true
      - name: Test
        env:
          DRY_RUN: ${{ steps.download.outputs.dry_run }}
        run: test "$DRY_RUN" == false
  download-with-check-artifacts:
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          workflow: upload.yml
          name: artifact
          path: artifact
          check_artifacts: true
      - name: Test
        run: cat artifact/sha | grep $GITHUB_SHA
  download-with-search-artifacts:
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          workflow: upload.yml
          name: artifact
          path: artifact
          search_artifacts: true
      - name: Test
        run: cat artifact/sha | grep $GITHUB_SHA
  download-regexp-with-search-artifacts:
    runs-on: ubuntu-latest
    needs: wait
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download
        uses: ./
        with:
          workflow: upload.yml
          name: artifact.
          name_is_regexp: true
          path: artifact
          search_artifacts: true
      - name: Test
        run: |
          cat artifact/artifact1/sha1 | grep $GITHUB_SHA
          cat artifact/artifact2/sha2 | grep $GITHUB_SHA
          ! test -d artifact/artifact/artifact
          ! test -f artifact/artifact.zip
